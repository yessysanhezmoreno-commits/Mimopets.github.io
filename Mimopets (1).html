<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Mimopets</title>
<style>
:root{--bg:#f1f7fc;--card:#fff;--tx:#14263a;--mu:#5f7183;--pr:#2e75b6;--ok:#27ae60;--wa:#e8590c;--bd:#d9e6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1822;--card:#18242f;--tx:#eaf3fb;--mu:#9fb2c4;--pr:#5aa9e6;--ok:#4cd084;--wa:#ff8a4c;--bd:#263646;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1822;--card:#18242f;--tx:#eaf3fb;--mu:#9fb2c4;--pr:#5aa9e6;--ok:#4cd084;--wa:#ff8a4c;--bd:#263646;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:30px}
main{max-width:560px;margin:0 auto;padding:14px 16px}
h1{font-size:25px;margin:6px 0 4px}h2{font-size:18px;margin:16px 0 6px}
.mu{color:var(--mu);font-size:14px}
.card{background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.hero{background:linear-gradient(135deg,var(--pr),#ff7eb3);color:#fff;border:0}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.av{font-size:34px}.ph{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}.pv{width:90px;height:90px;border-radius:12px;object-fit:cover;margin:4px 0;display:block}.pv[hidden]{display:none}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:6px;text-decoration:none;display:block;text-align:center}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.w{background:var(--wa)}.btn.o{background:var(--ok)}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--wa);color:#fff}.tag.f{background:var(--ok)}.tag.p{background:var(--pr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 8px;text-align:center;font:inherit;color:var(--tx);cursor:pointer}.tile span{display:block;font-size:30px}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.seg button.a{background:var(--pr);color:#fff;border-color:var(--pr)}
.note{background:color-mix(in srgb,var(--wa) 14%,transparent);border-radius:12px;padding:10px;font-size:13px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mu);font:inherit;font-size:11px;cursor:pointer}nav button.a{color:var(--pr);font-weight:700}nav span{display:block;font-size:21px}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;color:var(--pr);opacity:.26;pointer-events:none}
.hero{position:relative;overflow:hidden}.hero>*{position:relative}.hero>.hs{position:absolute;right:-6px;bottom:-4px;width:150px;color:#fff;opacity:.3;pointer-events:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd)}
#nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;max-width:560px;margin:0 auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#nav button.a{background:var(--pr);color:#fff;border-color:var(--pr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}

.bb{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:88%;font-size:15px;line-height:1.4}
.bb.user{background:var(--pr);color:#fff;margin-left:auto}.bb.assistant{background:var(--card);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button{border:1px solid var(--pr);background:transparent;color:var(--pr);border-radius:20px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}

.bgimg{position:fixed;inset:0;z-index:-1;background:var(--img) center/cover no-repeat}
.bgimg::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.top{display:flex;align-items:center;gap:4px;padding-left:12px}
.logo{font-weight:800;color:var(--pr);white-space:nowrap;font-size:16px}
.top #nav{flex:1;min-width:0;margin:0;max-width:none}
.hero2{position:relative;overflow:hidden;background:#ffcec0;display:flex;flex-direction:column;min-height:calc(100vh - 58px);min-height:calc(100svh - 58px - env(safe-area-inset-top,0px))}
.hcopy{position:relative;color:#fff;padding:28px 20px 84px}
.hcopy::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#1f5f9e,#3b8fd0);clip-path:polygon(0 0,100% 0,100% 72%,0 100%)}
.hcopy::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);clip-path:polygon(0 90%,100% 62%,100% 69%,0 97%)}
.hcopy>*{position:relative;z-index:1}
.hcopy em{display:block;font-size:31px;font-weight:300;line-height:1.15;max-width:88%}
.hcopy p{font-size:12px;opacity:.92;max-width:80%;margin:10px 0 0}
.hpic{flex:1;min-height:210px;background:var(--img) center/contain no-repeat}
.srch{position:relative;margin:0 auto 20px;width:calc(100% - 24px);max-width:560px;background:#fff;color:#14263a;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.srch label{display:block;padding:8px 12px;font-size:11px;color:#5f7183;border-bottom:1px solid #eee}.srch label.w{grid-column:1/-1}
.srch select,.srch input{display:block;width:100%;border:0;margin:0;padding:3px 0 0;background:#fff;color:#14263a;font:inherit;font-size:15px;font-weight:600;border-radius:0}
.srch button{grid-column:1/-1;border:0;background:#2e75b6;color:#fff;padding:13px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.hm main{max-width:none;padding:0}body.hm{padding-bottom:0}
.hm .hcopy{padding-left:max(20px,calc(50% - 280px));padding-right:20px}

.pill{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:4px 12px;font-size:12px;margin-bottom:10px}
.hcopy em b{color:#ffd54a;font-weight:700}
.cta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cta button{border:0;border-radius:24px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.cta .y{background:#ffd54a;color:#14263a;box-shadow:0 4px 14px rgba(0,0,0,.25)}.cta .o{background:transparent;color:#fff;border:2px solid #fff}
.hcopy::before{background:linear-gradient(120deg,#1f5f9e,#2e75b6,#3b8fd0,#1f5f9e);background-size:300% 300%;animation:gs 10s ease infinite}
.hpic{animation:fl 4s ease-in-out infinite}
.hcopy>*{animation:up .6s ease both}.hcopy>*:nth-child(2){animation-delay:.1s}.hcopy>*:nth-child(3){animation-delay:.2s}.hcopy>*:nth-child(4){animation-delay:.3s}
@keyframes gs{50%{background-position:100% 50%}}@keyframes fl{50%{transform:translateY(-7px)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.hcopy::before,.hpic,.hcopy>*{animation:none}}
.logo{display:flex;align-items:center;gap:6px;font-size:19px;letter-spacing:-.3px}
.logo .lg{width:34px;height:34px;border-radius:50%;flex:none}.logo i{font-style:normal;color:var(--pr)}.logo u{text-decoration:none;color:#4db8ea}
.hl{width:64px;height:64px;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.3);flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}.brand .pill{margin:0;font-weight:600}
</style>
</head>

<header class="top"><b class="logo">Mimopets</b><div id="nav"></div></header>
<main id="app"></main>

const FC=[['n','Tu nombre'],['sv','Servicio','s:Paseos|Cuidado en casa|Guardería|Paseos y cuidado'],['z','Zona donde trabajas'],['r','Tarifa (ej. S/ 15 por paseo)'],['d','Experiencia y sobre ti','t'],['img','Tu foto','i'],['p',PH,'p']];
function carers(){const l=flt(S.carers).filter(c=>fv==='Todos'||c.sv===fv);
return `<h1>Cuidadores</h1><div class="mu">Encuentra a alguien que pasee o cuide a tu mascota, o regístrate como cuidador.</div>
<select onchange="fv=this.value;render()">${['Todos','Paseos','Cuidado en casa','Guardería','Paseos y cuidado'].map(o=>`<option ${o===fv?'selected':''}>${o}</option>`).join('')}</select>`+
l.map(x=>card('carers',{...x,e:'🧑'},`<span class="tag p">${esc(x.sv)}</span>`,`${esc(x.z)}${x.r?' · '+esc(x.r):''}`,x.d,ct(x.p,`Hola ${x.n}, vi tu perfil de cuidador en Mimopets y necesito tu servicio.`))).join('')+
`<div class="card"><b>Registrarme como cuidador</b>${F('c',FC)}<button class="btn" onclick="add('carers','c',FC,['n','p'])">Registrarme</button></div><div class="note">Pide referencias y conoce al cuidador antes de dejar a tu mascota.</div>`}

const FPL=[['n','Nombre del lugar'],['z','Dirección o zona'],['d','Nota (ej. sin correa, abierto 24 h)'],['p','Teléfono (opcional)','p']];
function places(){const P=sub.places==='park',k='places';const l=S.places.filter(x=>(x.t||'park')===sub.places);
return `<h1>Parques y veterinarias</h1>${seg('places',[['park','🌳 Dónde pasear'],['vet','🩺 Veterinarias']])}
<a class="btn" href="${maps(P?'parques y áreas verdes cerca de mí':'veterinarias cerca de mí')}" target="_blank" rel="noopener">📍 Ver ${P?'parques':'veterinarias'} cerca de mí en el mapa</a>
<h2>Recomendados por la comunidad</h2>`+(l.length?l.map(x=>card(k,{...x,e:P?'🌳':'🩺'},'',esc(x.z||''),x.d,`<a class="btn s" href="${maps(x.n+' '+(x.z||''))}" target="_blank" rel="noopener">🗺 Cómo llegar</a>`+(x.p?`<a class="btn o" href="tel:${esc(x.p)}">📞 Llamar</a>`:''))).join(''):'<p class="mu">Aún no hay lugares. ¡Agrega el primero!</p>')+
`<div class="card"><b>Agregar ${P?'un parque o área libre':'una veterinaria'}</b>${F('q',FPL)}<button class="btn s" onclick="S.places.unshift({id:id(),t:'${sub.places}',date:today(),...Object.fromEntries(FPL.map(f=>[f[0],$('q'+f[0]).value.trim()]))});if(!S.places[0].n){S.places.shift();alert('Pon el nombre del lugar.');return}save();render()">Agregar</button></div>`}

const FE=[['n','Nombre de tu mascota'],['e','','e'],['x','Sexo','s:Macho|Hembra'],['b','Raza'],['a','Edad'],['o','Objetivo','s:Amigos para jugar|Cruce responsable'],['z','Tu zona'],['d','Carácter, vacunas, salud','t'],['img','Foto de tu mascota','i'],['p',PH,'p']];
function meet(){
return `<h1>Encuentros de mascotas</h1><div class="mu">Conecta con otros dueños para juegos o cruces responsables.</div><div class="note">Para un cruce: ambas mascotas deben tener vacunas al día, chequeo veterinario y edad adecuada. Acuerden con anticipación qué pasará con las crías.</div>`+
flt(S.meet).map(x=>card('meet',x,`<span class="tag p">${esc(x.o)}</span>`,esc([x.x,x.b,x.a,x.z].filter(Boolean).join(' · ')),x.d,ct(x.p,`Hola, vi a ${x.n} en Mimopets y me gustaría coordinar un encuentro.`))).join('')+
`<div class="card"><b>Publicar mi mascota</b>${F('e',FE)}<button class="btn" onclick="add('meet','e',FE,['n','p'])">Publicar</button></div>`}

function more(){const V=['💗 Compasión','🔍 Transparencia','🤝 Responsabilidad','💡 Innovación','👥 Colaboración','🔗 Vínculos','📚 Orientación','🌈 Inclusión'];
return `<h1>Nosotros</h1><div class="mu">Más que mascotas, son familia.</div><h2>Misión</h2><div class="card mu">Brindar una solución frente a la pérdida de una mascota, logrando que se reencuentre con su familia, y ofrecer mejor calidad de vida y una oportunidad de hogar a quienes no cuentan con uno.</div><h2>Visión</h2><div class="card mu">Ser la plataforma líder en salud y bienestar de las mascotas, usando la tecnología y fomentando una cultura de responsabilidad y cuidado.</div><h2>Valores</h2><div class="grid">${V.map(v=>`<div class="card" style="margin:0;text-align:center">${v}</div>`).join('')}</div>`}

let chat=[],busy=0;
const bub=m=>`<div class="bb ${m.role}">${esc(m.content).replace(/\n/g,'<br>')}</div>`;
const SYS='Eres el asistente de Mimopets, una app de mascotas. Responde en español, en texto plano (sin markdown, sin asteriscos), de forma amable y breve (máximo 120 palabras). Solo informas sobre animales de compañía: razas, tamaño y temperamento, esperanza de vida y edad aproximada (por ejemplo equivalencia en años humanos), accesorios, alimentación general, adiestramiento básico, cuidados cotidianos y adopción responsable. Si la pregunta trata de salud, síntomas, enfermedades, medicinas, dosis, vacunas específicas, embarazo o emergencias, da solo una orientación general muy breve y recomienda consultar con un médico veterinario. Si el tema no tiene relación con mascotas, di amablemente que solo puedes ayudar con eso.';
function bot(){return `<h1>🤖 Asistente de mascotas</h1><div class="note">Te doy información básica: razas, edad, accesorios, alimentación general y más. Para salud, medicinas, síntomas o emergencias, consulta siempre a un médico veterinario.</div>
<div class="chips">${['¿Qué razas de perro son buenas para departamento?','¿Cuántos años vive un gato?','¿Qué accesorios necesita un cachorro?','¿Cómo es un perro salchicha?'].map(q=>`<button onclick="ask(this.textContent)">${q}</button>`).join('')}</div>
<div id="msgs">${chat.map(bub).join('')}</div>
<div class="row"><input id="bq" placeholder="Pregunta sobre razas, edad, accesorios…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" style="width:auto;margin:0;white-space:nowrap" onclick="ask()">Enviar</button></div>`}
async function ask(q){const i=$('bq');q=(q||i.value).trim();if(!q||busy)return;if(!use())return;i.value='';
chat.push({role:'user',content:q});const m=$('msgs');m.insertAdjacentHTML('beforeend',bub(chat[chat.length-1]));
const el=document.createElement('div');el.className='bb assistant';el.textContent='Pensando…';m.appendChild(el);busy=1;
try{const sm=await claude.use('sample');if(!sm)throw{code:'na'};
const h=chat.slice(-7).map(x=>({role:x.role,content:x.content}));
h[h.length-1].content=(pro()?SYS.replace('máximo 120 palabras','máximo 300 palabras, con más detalle, comparaciones y consejos prácticos'):SYS)+'\n\nConversación y pregunta actual del usuario: '+q;
const r=await sm(h,{onText:({text})=>{el.textContent=text},cache:false,modelTier:pro()?'default':'quick'});
el.innerHTML=esc(r.text).replace(/\n/g,'<br>');chat.push({role:'assistant',content:r.text})}
catch(e){chat.pop();el.textContent=e&&e.code==='not_granted'?'Para usar el asistente debes aceptar el permiso cuando se te pida.':e&&e.code==='rate_limited'?'Hay muchas preguntas seguidas. Espera un momento e intenta de nuevo.':'El asistente no está disponible ahora. Intenta de nuevo más tarde.'}
busy=0;el.scrollIntoView({block:'nearest'})}
let q={};
const FREE=3,nz=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),pro=()=>!!(S.user&&S.user.plan==='premium');
const use=()=>{if(!S.user){pend=tab;go('reg');return 0}if(pro())return 1;if(S.user.uses>=FREE){alert('Llegaste al límite de '+FREE+' usos del plan Básico. Pasa a Premium para usar Mimopets sin límites.');go('premium');return 0}S.user.uses++;save();return 1};
const flt=a=>a.filter(x=>(!q.z||String(x.z||'').toLowerCase().includes(q.z))&&(!q.e||x.sv||x.e===q.e)&&(!q.k||!pro()||q.k.split(/\s+/).filter(Boolean).every(w=>nz([x.n,x.z,x.d,x.b,x.a,x.sv,x.x,x.o,x.r].join(' ')).includes(w)))).sort((a,b)=>(b.pro?1:0)-(a.pro?1:0));
const fbar=()=>(q.z||q.e||q.k)&&['lost','adopt','carers','meet'].includes(tab)?`<div class="note">Filtro activo: ${[q.e,q.z,q.k].filter(Boolean).map(esc).join(' · ')} <button class="x" onclick="q={};render()">Quitar ✕</button></div>`:'';
const doSearch=()=>{const w=$('sq0').value;q={z:$('sq2').value.trim().toLowerCase(),e:$('sq1').value,k:pro()?nz($('sq3').value.trim()):''};const t=w==='found'?'lost':w;if(w==='lost'||w==='found')sub.lost=w;if(!S.user){pend=t;go('reg');return}if(!use())return;go(t)};
const ubar=()=>!S.user||['home','reg','premium'].includes(tab)?'':`<div class="card row" style="padding:8px 12px"><div class="grow mu">${pro()?'⭐ Premium · usos ilimitados':`Plan Básico · te quedan <b>${Math.max(0,FREE-S.user.uses)}</b> de ${FREE} usos`}</div>${pro()?'':`<button class="btn" style="width:auto;margin:0;padding:6px 12px" onclick="go('premium')">Premium</button>`}</div>`;
const acct=()=>S.user?`<div class="card"><b>${esc(S.user.n)}</b> <span class="tag ${pro()?'':'p'}">${pro()?'⭐ Premium':'Básico'}</span><div class="mu">${esc(S.user.m)}${pro()?' · usos ilimitados':` · te quedan ${Math.max(0,FREE-S.user.uses)} de ${FREE} usos`}</div><button class="btn s" onclick="go('premium')">${pro()?'Mi plan':'Pasar a Premium'}</button><button class="btn s" onclick="if(confirm('¿Cerrar sesión?')){S.user=null;save();go('home')}">Cerrar sesión</button></div>`:'';
const FU=[['n','Nombre completo'],['m','Correo electrónico'],['p',PH,'p'],['z','Tu zona o distrito']];
function reg(){return `<div class="card"><div style="text-align:center"><img class="hl" style="width:84px;height:84px" src="${LOGO}" alt="Mimopets"></div><h1>Crea tu cuenta gratis</h1><div class="mu">Regístrate para usar Mimopets. El plan Básico incluye ${FREE} usos; con Premium son ilimitados.</div>${F('u',FU)}<button class="btn" onclick="signup()">Registrarme</button><button class="btn s" onclick="go('premium')">Ver planes</button></div><div class="note">Tus datos se guardan solo en este navegador. No pedimos contraseña.</div>`}
function signup(){const v=Object.fromEntries(FU.map(f=>[f[0],$('u'+f[0]).value.trim()]));if(!v.n||!/^\S+@\S+\.\S+$/.test(v.m)||!v.p){alert('Escribe tu nombre, un correo válido y tu teléfono.');return}S.user={...v,plan:'free',uses:0,date:today()};S.me={n:v.n,p:v.p,z:v.z};save();const t=pend||'lost';pend=null;go(t)}
function setPlan(p){if(!S.user){pend='premium';go('reg');return}if(p==='premium'&&!confirm('Esto es una demostración: no se realizará ningún cobro. ¿Activar Premium?'))return;S.user.plan=p;save();render()}
function premium(){const p=pro(),u=S.user;
return `<h1>⭐ Mimopets Premium</h1><div class="mu">Usa Mimopets sin límites y encuentra más rápido a tu mascota.</div>
<div class="card"><b>Básico · Gratis</b><p class="mu">• ${FREE} usos en total (publicar un aviso, buscar o preguntar al asistente)<br>• Búsqueda por zona y tipo de mascota<br>• Asistente con respuestas breves<br>• Avisos normales</p>${u&&!p?'<span class="tag f">Tu plan actual</span>':''}</div>
<div class="card" style="border:2px solid #f5b301"><b>⭐ Premium · S/ 9.90 al mes</b> <span class="mu">(precio de ejemplo)</span><p class="mu">• Usos ilimitados<br>• Búsqueda de alta precisión: por color, raza o detalles, sin importar tildes<br>• Avisos destacados ⭐ que aparecen primero<br>• Asistente con respuestas más completas y detalladas<br>• Insignia ⭐ en tu cuenta</p>${p?`<span class="tag f">Tu plan actual</span><button class="btn s" onclick="setPlan('free')">Volver al plan Básico</button>`:`<button class="btn" style="background:#f5b301;color:#14263a" onclick="setPlan('premium')">Activar Premium (demostración)</button>`}</div>
<div class="note">Demostración: el cobro aún no está conectado. Para cobrar de verdad hace falta integrar un medio de pago y un servidor que guarde las cuentas.</div>`}
function render(){
document.body.classList.toggle('hm',tab==='home');document.querySelector('.logo').innerHTML=`<img src="${LOGO}" alt="" class="lg"><span><i>Mimo</i><u>pets</u></span>`+(pro()?' ⭐':'');app.innerHTML=ubar()+fbar()+{home,profile,lost,adopt,carers,places,meet,bot,more,reg,premium}[tab]();
nav.innerHTML=[['home','🏠','Inicio'],['profile','👤','Perfil'],['lost','🚨','Perdidas'],['adopt','🏡','Adopción'],['carers','🦮','Cuidadores'],['places','🌳','Lugares'],['bot','🤖','Asistente'],['premium','⭐','Premium'],['meet','💞','Encuentros'],['more','ℹ️','Nosotros']].map(t=>`<button class="${tab===t[0]?'a':''}" onclick="go('${t[0]}')">${t[1]} ${t[2]}</button>`).join('');const a=nav.querySelector('.a');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
render();
</script>
</body>
</html>
